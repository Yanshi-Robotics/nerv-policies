<text x="708.5" y="276.5" font-size="10" font-weight="700" fill="#2563eb" text-anchor="middle" class="mono">CONTRACT</text>
<text x="384" y="279" font-size="16" font-weight="700" fill="#0f172a" text-anchor="start">contract.json</text>
<text x="384" y="302" font-size="13.5" font-weight="400" fill="#475569" text-anchor="start">Single truth: joint order, kp/kd, obs, scale, dt</text>
<rect x="364" y="338" width="394" height="74" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4" filter="url(#shadow)"/>
<rect x="364" y="338" width="6" height="74" rx="3" fill="#0d9488"/>
