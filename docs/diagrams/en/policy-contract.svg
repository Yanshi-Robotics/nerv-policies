<text x="384" y="365" font-size="16" font-weight="700" fill="#0f172a" text-anchor="start">release.yaml</text>
<text x="384" y="388" font-size="13.5" font-weight="400" fill="#475569" text-anchor="start">PD torque mode, deadband, turn_vx &amp; provenance</text>
