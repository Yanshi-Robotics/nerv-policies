<rect x="834" y="120" width="330" height="150" rx="14" fill="#f0fdfa" stroke="#cbd5e1" stroke-width="1.4" filter="url(#shadow)"/>
<rect x="834" y="120" width="6" height="150" rx="3" fill="#0d9488"/>
<rect x="854" y="132" width="92" height="22" rx="11" fill="#ffffff" stroke="#0d9488" stroke-width="1" stroke-opacity="0.45"/>
<text x="900.0" y="147" font-size="10.5" font-weight="700" fill="#0d9488" text-anchor="middle" class="mono">QUALIFIED</text>
<text x="854" y="174" font-size="16.5" font-weight="700" fill="#0f172a" text-anchor="start">Unitree G1 (Implicit PD)</text>
<text x="854" y="198" font-size="13.5" font-weight="400" fill="#475569" text-anchor="start">g1-29dof-turn · Qualified in 0.9.1</text>
<text x="854" y="220" font-size="13.5" font-weight="400" fill="#475569" text-anchor="start">Write kd -&gt; dof_damping; tau = kp(q*-q)</text>
<text x="854" y="242" font-size="13.5" font-weight="400" fill="#475569" text-anchor="start">deadband = 0.2 m/s, turn_vx = 0.0</text>
<rect x="834" y="286" width="330" height="150" rx="14" fill="#fef2f2" stroke="#cbd5e1" stroke-width="1.4" filter="url(#shadow)"/>
<rect x="834" y="286" width="6" height="150" rx="3" fill="#dc2626"/>
<rect x="854" y="298" width="84" height="22" rx="11" fill="#ffffff" stroke="#dc2626" stroke-width="1" stroke-opacity="0.45"/>
<text x="896.0" y="313" font-size="10.5" font-weight="700" fill="#dc2626" text-anchor="middle" class="mono">BLOCKED</text>
<text x="854" y="340" font-size="16.5" font-weight="700" fill="#0f172a" text-anchor="start">Unitree Go2 (Explicit PD)</text>
<text x="854" y="364" font-size="13.5" font-weight="400" fill="#475569" text-anchor="start">go2-velocity-flat · Motion blocked</text>
<text x="854" y="386" font-size="13.5" font-weight="400" fill="#475569" text-anchor="start">Zero damping; tau = kp(q*-q) - kd*qd</text>
<text x="854" y="408" font-size="13.5" font-weight="400" fill="#475569" text-anchor="start">Missing command_ranges &amp; deadband</text>
<rect x="36" y="466" width="1128" height="116" rx="14" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.4"/>
<text x="58" y="496" font-size="13.5" font-weight="700" fill="#1d4ed8" text-anchor="start">HOW NERV CONSUMES THIS REPOSITORY</text>
<text x="58" y="524" font-size="13.5" font-weight="400" fill="#0f172a" text-anchor="start">• NERV imports policies by pinned path or GitHub/HF revision and runs `policy check` before allowing motion.</text>
<text x="58" y="550" font-size="13.5" font-weight="400" fill="#0f172a" text-anchor="start">• Worlds &amp; robot MJCF bodies live separately in Yanshi-Robotics/nerv-assets (decoupled since 2026-09-02).</text>
</svg>
