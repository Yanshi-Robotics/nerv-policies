<text x="36" y="75" font-size="24" font-weight="700" fill="#0f172a" text-anchor="start">NERV Policy Release Shelf: Three-File Deployment Contract</text>
<text x="1164" y="36" font-size="12" font-weight="600" fill="#64748b" text-anchor="end" class="mono">YANSHI ROBOTICS · NERV ECOSYSTEM</text>
<text x="36" y="620" font-size="13.5" font-weight="400" fill="#64748b" text-anchor="start">Always ship policy.onnx, contract.json, and release.yaml together; never mix implicit and explicit PD torque modes.</text>
