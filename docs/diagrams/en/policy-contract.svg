<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
<title id="title">NERV Policy Release Shelf: Three-File Deployment Contract</title>
<desc id="desc">Always ship policy.onnx, contract.json, and release.yaml together; never mix implicit and explicit PD torque modes.</desc>
