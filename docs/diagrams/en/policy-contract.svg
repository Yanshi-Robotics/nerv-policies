<rect x="364" y="252" width="394" height="74" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4" filter="url(#shadow)"/>
<rect x="364" y="252" width="6" height="74" rx="3" fill="#2563eb"/>
